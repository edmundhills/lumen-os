#
# yamllint settings, used by `just lint` (tests/lint/run.sh) and by editors.
# The rules: https://yamllint.readthedocs.io/en/stable/rules.html

extends: default

rules:
  # Files start with their licence header, not a "---" line.
  document-start: disable
  # A workflow's "on:" key is not a yes/no value, though YAML 1.1 reads it as one.
  truthy:
    check-keys: false
  line-length:
    max: 120
