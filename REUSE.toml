# SPDX-FileCopyrightText: 2026 Lumen OS contributors
#
# SPDX-License-Identifier: GPL-3.0-or-later
#
# Licence information for files that can't hold a comment header, such as
# images. Every other file carries its own header (CONTRIBUTING.md, "Licence
# headers"). Format: https://reuse.software/spec/

version = 1

[[annotations]]
path = "docs/images/**"
SPDX-FileCopyrightText = "2026 Lumen OS contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Plasma package metadata is JSON, which has no comments. A .license file next
# to it would be copied into the image with the rest of image/overlay.
[[annotations]]
path = "image/overlay/**/metadata.json"
SPDX-FileCopyrightText = "2026 Lumen OS contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# The container trust policy is JSON too, and the signing key's public half is
# a PEM file that tools read whole (ADR 0008).
[[annotations]]
path = ["image/overlay/etc/containers/policy.json", "image/overlay/usr/share/pki/containers/lumen.pub"]
SPDX-FileCopyrightText = "2026 Lumen OS contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# RPM Fusion's nonfree signing key, copied unchanged from its release package
# (github.com/rpmfusion/rpmfusion-nonfree-release), whose licence is
# BSD-1-Clause, and the file that pins its SHA-256, which can't hold a comment
# that sha256sum --strict accepts (ADR 0019).
[[annotations]]
path = "image/gaming/RPM-GPG-KEY-rpmfusion-nonfree-fedora-2020"
SPDX-FileCopyrightText = "RPM Fusion"
SPDX-License-Identifier = "BSD-1-Clause"

[[annotations]]
path = "image/gaming/keys.sha256"
SPDX-FileCopyrightText = "2026 Lumen OS contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Lumen's kernel module signing certificate, a DER file that tools read whole
# (step 1.11a, ADR 0021).
[[annotations]]
path = "image/nvidia/module-signing.der"
SPDX-FileCopyrightText = "2026 Lumen OS contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"
