#
# Anaconda's install profile for Lumen: the defaults the installer uses when
# it lays out the disk. The live stage (step 1.8b) installs it in
# /etc/anaconda/profile.d/.
#
# Anaconda picks a profile by the os-release ID of the system it runs on. Once
# Lumen's os-release says ID=lumen (step 1.5), Fedora's profiles no longer
# match, and without this one Anaconda would fall back to its built-in
# defaults: LVM, with no Btrfs and no compression. This profile builds on
# Fedora Kinoite's and repeats the storage settings Lumen relies on, so a
# change upstream can't drop them (checked against anaconda-core 44.30):
#
#   default_scheme       Btrfs (spec: "Btrfs root with compression (zstd)").
#   btrfs_compression    zstd level 1, Fedora's choice: fast enough not to slow
#                        the disk, and it saves space on most files.
#   default_partitioning / up to 70 GiB, and /home as a Btrfs subvolume of its
#                        own, which snapper needs for its hourly snapshots
#                        (step 1.4). Kinoite's profile makes /var a subvolume
#                        too, but Anaconda 44.30's bootc install, which the
#                        installer uses (installer/anaconda/interactive-defaults.ks),
#                        empties the disk's root before bootc runs and then
#                        can't bind a /var of its own into the system: it stops
#                        with "special device /mnt/sysimage/var does not exist"
#                        (step 1.8c, docs/decisions/0014-install-from-the-iso.md).
#                        bootc keeps /var in the system's own state folder.

[Profile]
profile_id = lumen
base_profile = fedora-kinoite

[Profile Detection]
os_id = lumen

[Storage]
default_scheme = BTRFS
btrfs_compression = zstd:1
default_partitioning =
    /     (min 1 GiB, max 70 GiB)
    /home (min 500 MiB, free 50 GiB)
