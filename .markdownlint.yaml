#
# markdownlint settings, used by `just lint` (tests/lint/run.sh) and by editors.
# The rules: https://github.com/DavidAnson/markdownlint/blob/main/doc/Rules.md

default: true

# Each paragraph is written on one line, so long lines are expected.
MD013: false

# Bold lead-in lines such as **Mitigation** in docs/risks.md are used on
# purpose, as labels rather than headings.
MD036: false
