#
# The profile tuned starts with before it has one of its own: Lumen's
# Balanced, everywhere, in place of what Fedora's 50-tuned.conf picks, such
# as virtual-guest in a VM. tuned reads the files here in name order and takes
# the first section that matches, and a section without conditions always
# matches. tuned-ppd moves it to the power mode chosen once it starts, but a
# Fedora profile applied first would still run bootc, then run it again when
# tuned left it (docs/decisions/0013-tuned-profiles.md).

[lumen-balanced]
