#
# One of Lumen's power modes, which tuned-ppd maps to (/etc/tuned/ppd.conf):
# the Fedora profile it includes, as it is, except that tuned leaves the
# kernel's arguments alone, so it never runs bootc to change them. Otherwise
# tuned 2.28 runs bootc on every profile it applies, and bootc's check for
# SELinux install rights is refused under tuned's policy
# (docs/decisions/0013-tuned-profiles.md).

[main]
summary=Balanced: Fedora's balanced, without kernel argument changes
include=balanced

[bootloader]
skip_grub_config=True
