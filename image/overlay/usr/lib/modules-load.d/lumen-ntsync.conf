# Load Wine's NT synchronization driver at every start (spec, "Windows apps";
# step 1.13). Wine and Proton use /dev/ntsync whenever it exists, which runs
# Windows programs and games faster, and nothing loads the module on demand:
# it drives no hardware. The kernel lets anyone open the device (mode 0666),
# and Bottles' and Steam's sandboxes see it.
ntsync
