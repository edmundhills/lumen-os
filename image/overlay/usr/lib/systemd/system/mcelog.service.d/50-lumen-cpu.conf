#
# mcelog, which Kinoite enables, supports no AMD processor since family 16
# (2008) and no Hygon one: on those it says "mcelog does not support this
# processor. Please use the edac_mce_amd module instead" and exits with an
# error. Its unit skips itself only once edac_mce_amd is loaded, which isn't so
# in a VM or on every AMD PC, and there mcelog.service failed on every boot
# (step 1.9, docs/decisions/0017-boot-test.md). Skip it on those processors
# too: a skipped unit isn't a failed one. Intel processors keep mcelog, and the
# kernel logs machine checks on AMD ones itself.
[Service]
ExecCondition=/bin/sh -c '! grep -qE "^vendor_id[[:space:]]*:[[:space:]]*(AuthenticAMD|HygonGenuine)" /proc/cpuinfo'
