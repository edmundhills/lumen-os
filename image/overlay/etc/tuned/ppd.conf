#
# tuned-ppd's power modes, which Plasma offers: Fedora's file with Lumen's
# profiles in place of Fedora's. Each includes the Fedora profile it replaces
# and keeps tuned from running bootc (/usr/lib/tuned/profiles/lumen-*,
# docs/decisions/0013-tuned-profiles.md). It lives in /etc because tuned-ppd
# reads it only there.

[main]
# The default PPD profile
default=balanced
battery_detection=true
sysfs_acpi_monitor=true

[profiles]
# PPD = TuneD
power-saver=lumen-powersave
balanced=lumen-balanced
performance=lumen-performance

[battery]
# PPD = TuneD
balanced=lumen-balanced-battery
