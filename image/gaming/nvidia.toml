#
# What the gaming layer adds on the NVIDIA edition, for lumen-gaming-nvidia
# (step 1.12b, docs/decisions/0019-gaming-edition.md): the lumen-gaming stage
# applies this after packages.toml when its base has NVIDIA's driver, through
# packages.py as packages.toml is applied.

# The 32-bit build at the version of the 64-bit driver in the image, and
# nothing the image has changed (image/multilib.py).
exact_32bit = true

[gaming-nvidia]
install = [
  # NVIDIA's 32-bit OpenGL and Vulkan libraries, from RPM Fusion: Steam and
  # most of its games are 32-bit programs, and without these they run on
  # software rendering on an NVIDIA card
  "xorg-x11-drv-nvidia-libs.i686",
]
