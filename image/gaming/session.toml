#
# The Gamescope session's files (step 1.10b, docs/decisions/0020-gamescope-session.md):
# Steam's Big Picture mode as a session on the login screen, from ChimeraOS's
# gamescope-session and gamescope-session-steam (MIT). Fedora doesn't package
# them. The lumen-gaming stage of image/Containerfile downloads each file from
# its repository at the commit below, checks it against its SHA-256 and
# installs it unchanged (image/gaming/session.py), so the image holds exactly
# these files and a changed one stops the build.
#
# Each [[source]] is one repository at one commit. Each file has its path in
# the repository, its SHA-256, and optionally the mode it gets (default 0644)
# and where it goes in the image (default: the same path).
#
# Left out on purpose: gamescope-session's export-gpu, an interactive GPU
# picker nothing calls, and gamescope-session-steam's SteamOS helpers
# (steamos-update, jupiter-biosupdate, steamos-select-branch, the
# steamos-polkit-helpers and their polkit policy org.chimeraos.update.policy),
# which update ChimeraOS and a Steam Deck's firmware as root. Lumen's own
# steamos-update (image/gaming/overlay) tells Steam there is no system update:
# lumen-updated owns those (Phase 5). steam-http-loader, which hands links to
# Steam, is left out too.

