#
# The base workflow keeps the base images Lumen pins current and copied (step
# 1.5b, ADR 0004, docs/versions.md). quay.io deletes a dated Kinoite build four
# weeks after it is made, and Fedora's registry drops old digests too.
#
#   copy   Copies each base that image/Containerfile and tests/lint/Containerfile
#          pin on main to ghcr.io/<owner>/<name> with its digest intact, so
#          older commits stay buildable. CI pulls the bases from these copies
#          first (build-image.yml, lint.yml).
#   bump   Every Monday, moves the pins to the newest builds, and Kinoite's to
#          a new Fedora release once Bodhi lists it as current, copies the new
#          bases, and opens a pull request from the branch bump-bases.
#
# image/bump_bases.py does the reading and rewriting, image/copy-bases.sh the
# copying. Both jobs run only on main: they need a token that can write
# packages, and a bump starts from main.

name: base

on:
  schedule:
    # Mondays at 05:17 UTC. Kinoite's daily build reaches quay.io at about 03:15.
    - cron: "17 5 * * 1"
  # A merged bump: copy its bases straight away.
  push:
    branches: [main]
    paths:
      - image/Containerfile
      - tests/lint/Containerfile
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# `bash -eo pipefail` for every step, so a failure inside a pipe fails it
# (build-image.yml).
defaults:
  run:
    shell: bash

jobs:
  copy:
    name: Copy the pinned bases to ghcr.io
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s\n' "$TOKEN" | skopeo login --username "$GITHUB_ACTOR" --password-stdin ghcr.io

      # Already copied bases are skipped; each copy must be public
      # (image/copy-bases.sh).
      - name: Copy
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}
        run: image/copy-bases.sh "$REGISTRY" image/Containerfile tests/lint/Containerfile

  bump:
    name: Bump the pins
    if: github.event_name != 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write  # push the branch
      packages: write  # copy the new bases
      pull-requests: write  # open its pull request
      actions: write  # start lint and image on it, if GitHub doesn't
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      BRANCH: bump-bases
      BOT_NAME: github-actions[bot]
      BOT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Look for newer bases
        id: bump
        run: |
          message=$RUNNER_TEMP/message
          python3 image/bump_bases.py bump image/Containerfile tests/lint/Containerfile >"$message"
          if [[ ! -s $message ]]; then
            printf 'Every pin is current.\n' | tee -a "$GITHUB_STEP_SUMMARY"
            printf 'changed=false\n' >>"$GITHUB_OUTPUT"
            exit 0
          fi
          tee -a "$GITHUB_STEP_SUMMARY" <"$message"
          git diff
          printf 'changed=true\n' >>"$GITHUB_OUTPUT"

      # The branch belongs to this workflow: each run replaces it with a fresh
      # bump of main. But once a person adds a commit to its open pull request,
      # for example to fix image/packages.toml for a new Fedora release, runs
      # leave it alone until that pull request is merged or closed, so their
      # work isn't lost.
      - name: Push the branch
        id: push
        if: steps.bump.outputs.changed == 'true'
        run: |
          number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open \
            --json number --jq '.[0].number // empty')
          printf 'number=%s\n' "$number" >>"$GITHUB_OUTPUT"
          if [[ -n $number ]]; then
            authors=$(gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json commits --jq '.commits[].authors[].email')
            if grep -qvxF "$BOT_EMAIL" <<<"$authors"; then
              printf '::warning::Pull request #%s has commits from people, so this run leaves it alone.\n' "$number"
              printf 'pushed=false\n' >>"$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          git commit --quiet --all --file="$RUNNER_TEMP/message"
          # The token goes in a header for this one command, as
          # actions/checkout does, so it is never saved in .git/config.
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 --wrap=0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push --force origin "HEAD:refs/heads/$BRANCH"
          printf 'pushed=true\n' >>"$GITHUB_OUTPUT"

      # Copy the new bases now, not only once the bump is merged: a pull request
      # can wait more than four weeks, for example while lumen-glass is rebased
      # onto a new KWin, and quay.io would delete its base in the meantime. The
      # branch's CI then pulls them from ghcr.io too.
      - name: Copy the new bases to ghcr.io
        if: steps.push.outputs.pushed == 'true'
        run: |
          printf '%s\n' "$GH_TOKEN" | skopeo login --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          image/copy-bases.sh "$REGISTRY" image/Containerfile tests/lint/Containerfile

      # The pull request's checks are its own lint and image runs. GitHub makes
      # them even though the workflow's token opened it, but on 2026-10-28 it
      # held them for approval, because github-actions[bot] had no merged
      # contribution yet: the pull request then says "Approve workflows to run".
      # It made no runs for the push to the branch. Runs started here with
      # workflow_dispatch test the same commit but don't show on the pull
      # request, so they are only the fallback when GitHub made no runs.
      - name: Open or update the pull request
        if: steps.push.outputs.pushed == 'true'
        env:
          NUMBER: ${{ steps.push.outputs.number }}
        run: |
          title=$(head -n 1 "$RUNNER_TEMP/message")
          body=$RUNNER_TEMP/body
          {
            tail -n +3 "$RUNNER_TEMP/message"
            printf '\n%s %s %s\n' \
              "Opened by the base workflow, which has already copied the new bases to ghcr.io." \
              "If GitHub holds this pull request's checks, press \"Approve workflows to run\" below." \
              "The commit is the workflow's and has no sign-off (CONTRIBUTING.md): whoever merges it reviews it."
          } >"$body"
          if [[ -n $NUMBER ]]; then
            gh pr edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$body"
          elif ! gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
            --title "$title" --body-file "$body"; then
            printf '::error::%s %s\n' "Could not open the pull request. If GitHub says Actions may not create them," \
              'tick "Allow GitHub Actions to create and approve pull requests" under Settings > Actions > General.'
            exit 1
          fi
          # GitHub makes the pull request's runs a few seconds after the push
          # or the opening.
          sha=$(git rev-parse HEAD)
          sleep 30
          count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$sha&event=pull_request" --jq .total_count)
          if ((count == 0)); then
            printf 'GitHub made no pull request runs for %s, so this starts lint and image on the branch.\n' "$sha"
            gh workflow run lint.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
            gh workflow run image.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
          fi
