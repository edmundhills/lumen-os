#
# The install ISO's boot and install tests (tests/README.md), in a VM with UEFI
# and Secure Boot, as a PC boots the USB:
#   - boot the ISO through two entries of its menu, and check the live session
#     inside: SELinux enforcing with no denials, the live user's Plasma, and
#     "Check this USB" passing (step 1.8b-3, tests/boot/boot_iso.py);
#   - install Lumen from it onto the VM's empty disk with no network, as the
#     live session's installer does, then start the installed system and check
#     that it runs the ISO's copy of the image and follows
#     ghcr.io/edmundhills/lumen:dev with signatures checked (step 1.8c,
#     tests/boot/install_iso.py).
#
# The iso workflow calls it once the ISO is made and kept. To boot the ISO of
# an earlier iso run again, while GitHub keeps it (7 days): Actions > boot-iso
# > Run workflow, with that run's number, the last part of its address.

name: boot-iso

on:
  workflow_call:
    inputs:
      run-id:
        description: The iso run whose ISO to boot; empty for the run that calls this.
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      run-id:
        description: >-
          The iso run whose ISO to boot: the number at the end of its address,
          such as 41045231975.
        type: string
        required: true

permissions: {}

# No concurrency group here: called from the iso workflow, it would share that
# workflow's group and wait for the run that called it.

defaults:
  run:
    shell: bash

jobs:
  boot:
    name: Boot the ISO
    runs-on: ubuntu-24.04
    # Booting takes minutes; installing may take most of an hour.
    timeout-minutes: 150
    permissions:
      # To download the ISO of another run.
      actions: read
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # The VM needs KVM, the kernel's hardware virtualization: without it,
      # QEMU emulates every instruction, far too slowly for a desktop. This
      # says in the run's summary what the runner has, and stops without it.
      - name: Check for KVM
        run: |
          # The backticks are Markdown, for the run's summary page.
          # shellcheck disable=SC2016
          {
            printf '### The runner\n\n'
            printf -- '- %s CPUs, %s of memory\n' "$(nproc)" "$(free --human | sed -n 's/^Mem: *\([^ ]*\).*/\1/p')"
            printf -- '- CPU virtualization: %s\n' "$(grep -o -m 1 -w -E 'vmx|svm' /proc/cpuinfo || echo none)"
            printf -- '- `/dev/kvm`: %s\n\n' "$(ls -l /dev/kvm 2>&1)"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [[ ! -c /dev/kvm ]]; then
            echo "::error::This runner has no /dev/kvm, so it can't run the VM at a usable speed."
            exit 1
          fi

      - name: Download the ISO
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: lumen-*-live-x86_64.iso
          merge-multiple: true
          path: ${{ runner.temp }}/iso
          # Another run's artifacts need the token; the calling run's don't.
          run-id: ${{ inputs.run-id || github.run_id }}
          github-token: ${{ inputs.run-id && github.token || '' }}

      # As in the lint workflow: the VM container's base, the lint container's
      # Fedora, is pulled from its copy on ghcr.io first.
      - name: Pull the bases from their copies
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}
        run: |
          sudo mkdir -p /etc/containers/registries.conf.d
          python3 image/bump_bases.py mirrors "$REGISTRY" image/Containerfile tests/lint/Containerfile |
            sudo tee /etc/containers/registries.conf.d/50-lumen-bases.conf

      - name: Build the VM container
        id: container
        run: |
          fedora=$(sed -n 's/^FROM //p' tests/lint/Containerfile)
          sudo podman build --build-arg "FEDORA=$fedora" --tag localhost/lumen-boot tests/boot

      - name: Boot the ISO
        run: |
          mapfile -t isos < <(find "$RUNNER_TEMP/iso" -type f -name 'lumen-*-live-x86_64.iso')
          if ((${#isos[@]} != 1)); then
            echo "::error::Expected one ISO in the download, found ${#isos[@]}: ${isos[*]}"
            exit 1
          fi
          iso=${isos[0]} out=$RUNNER_TEMP/boot report=$RUNNER_TEMP/boot-report status=0
          mkdir -p "$out"
          # The runner writes the report.
          # shellcheck disable=SC2024
          sudo podman run --rm --network=none --device /dev/kvm \
            --volume "$iso:/iso/${iso##*/}:ro" --volume "$PWD:/src:ro" --volume "$out:/out" \
            localhost/lumen-boot python3 /src/tests/boot/boot_iso.py --require-kvm \
            "/iso/${iso##*/}" /src/image/live/iso.yaml /out >"$report" 2>&1 || status=$?
          cat "$report"
          {
            printf '### The boot test\n\n```text\n'
            cat "$report"
            printf '```\n'
          } >>"$GITHUB_STEP_SUMMARY"
          exit "$status"

      # Install from the ISO even if the boot test failed: they find different
      # faults. The VM's disk, 64 GiB of which about 10 are used, is a sparse
      # file in the runner's temporary folder, not among the logs kept.
      - name: Install from the ISO
        if: ${{ !cancelled() && steps.container.outcome == 'success' }}
        run: |
          mapfile -t isos < <(find "$RUNNER_TEMP/iso" -type f -name 'lumen-*-live-x86_64.iso')
          iso=${isos[0]} out=$RUNNER_TEMP/boot report=$RUNNER_TEMP/install-report status=0
          mkdir -p "$out" "$RUNNER_TEMP/disk"
          # The runner writes the report.
          # shellcheck disable=SC2024
          sudo podman run --rm --network=none --device /dev/kvm \
            --volume "$iso:/iso/${iso##*/}:ro" --volume "$PWD:/src:ro" --volume "$out:/out" \
            --volume "$RUNNER_TEMP/disk:/disk" \
            localhost/lumen-boot python3 /src/tests/boot/install_iso.py --require-kvm \
            "/iso/${iso##*/}" /src/image/live/iso.yaml /disk/lumen.raw /out >"$report" 2>&1 || status=$?
          cat "$report"
          {
            printf '### The install test\n\n```text\n'
            cat "$report"
            printf '```\n'
          } >>"$GITHUB_STEP_SUMMARY"
          exit "$status"

      # The serial ports' and QEMU's logs, Anaconda's logs and the screenshots
      # of each boot.
      - name: Keep the logs and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: boot-iso
          path: ${{ runner.temp }}/boot
          retention-days: 7
          if-no-files-found: warn
