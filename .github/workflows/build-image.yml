# SPDX-FileCopyrightText: 2026 Lumen OS contributors
#
# SPDX-License-Identifier: GPL-3.0-or-later
#
# Build image/Containerfile, the way `just build-image` does in WSL, re-chunk
# it into the layers users download, make its SBOM and the qcow2 the boot test
# starts, and, when asked, push it to ghcr.io and sign it. image.yml calls this
# for every push and pull request; only its job for main asks for the push.
# docs/architecture.md, section 9.8.
#
# Re-chunking (image/rechunk.sh, ADR 0007) keeps the layer plan of the newest
# build on ghcr.io, so an update downloads only the layers whose packages
# changed. Each run says how much that is, and fails when a build on the same
# base image as the newest one would make users download more than
# DOWNLOAD_BUDGET_MIB (risk 14 in docs/risks.md).
#
# Signing (ADR 0008): the sign job signs the pushed digest with cosign and
# attaches the SBOM to it as a signed attestation. Its key is a secret of the
# GitHub environment image-signing, which only main may use, and the job runs
# on a runner of its own, so the key never reaches the one that ran the build.
# Only then does dev move, so a system that follows dev never meets an
# unsigned image: Lumen's trust policy would refuse it.
#
# Pushed tags (docs/architecture.md, section 9.7):
#   dev-<build version>   never moves, for example dev-44.20261028
#   sha-<commit>          never moves
#   dev                   the newest signed build of main

name: build-image

on:
  workflow_call:
    inputs:
      publish:
        description: Push the image to ghcr.io and sign it. Only builds of main do.
        type: boolean
        required: true
    # Secrets of the image-signing environment. The caller must pass them by
    # name even so: GitHub gives a called workflow only the secrets it is
    # passed, and an empty string for the rest. Only the caller for main does.
    secrets:
      COSIGN_PRIVATE_KEY:
        description: cosign's private key, which signs the image.
        required: false
      COSIGN_PASSWORD:
        description: The private key's password.
        required: false

# No permissions here: the jobs get exactly those their caller in image.yml
# grants, and only the caller for main can write packages.

# Naming the shell makes GitHub run each step with `bash -eo pipefail`. Its
# default, `bash -e`, ignores a failure on the left of a pipe, so a check
# piped into tee, such as the download budget's, could never fail the build.
defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build the image
    runs-on: ubuntu-24.04
    # Builds of main took 45 to 52 minutes before the qcow2 came (step 1.8a),
    # and the first with it 55 (ADR 0011, Follow-up).
    timeout-minutes: 120
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    env:
      # The image as Podman stores it on the runner, and where it is pushed.
      # Registry names must be lower case, and the owner's is.
      LOCAL_IMAGE: localhost/lumen:ci
      REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/lumen
      # The most an update between two builds on the same base may download.
      # A rebuild of an unchanged commit downloads 41 MiB: the rpm database
      # and the rest of what every build writes afresh, and the ostree commit
      # (ADR 0007). A change that needs more raises this in the same pull
      # request and says why.
      DOWNLOAD_BUDGET_MIB: 100
      # An earlier build, by digest, that an update isn't held to the budget
      # from, for a change that alters many files once. It stops applying as
      # soon as dev moves on. Now dev 44.20261030.3: Lumen's tuned profiles
      # add folders no package owns, which change the shared layer once (ADR
      # 0007 and 0013, Follow-up).
      DOWNLOAD_BUDGET_EXEMPT: "sha256:aae3c743479712804d1233fb7a43b7285385b5f0545c64aee056c9c59ab572d7"
      # osbuild's image-builder, which bootc-image-builder became, makes the
      # qcow2 (ADR 0011): the container of its release 88.0.0, by digest.
      IMAGE_BUILDER: >-
        ghcr.io/osbuild/image-builder-cli:v88.0.0@sha256:a0c38fa28181aca104b64465a1d21b385603ac62b184ced4041f467573a1534c
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Kinoite is 7.4 GB unpacked, and the build needs room for it, the image
      # made from it and the compressed layers of a push (risk 13 in
      # docs/risks.md). The runner's disk is mostly full of language tools
      # Lumen doesn't use, and the runner may have a second disk on /mnt.
      - name: Free disk space
        run: |
          df -h / /mnt
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache /usr/share/swift \
            /usr/local/share/powershell /usr/local/share/chromium /opt/microsoft \
            /opt/google /opt/az /usr/lib/jvm
          sudo docker system prune --all --force >/dev/null
          # Rootful Podman keeps its images in /var/lib/containers. Put that
          # on the second disk when it has more room than /.
          avail() { df --output=avail -- "$1" | tail -n 1; }
          if mountpoint -q /mnt && (($(avail /mnt) > $(avail /))); then
            sudo mkdir -p /mnt/containers /var/lib/containers
            sudo mount --bind /mnt/containers /var/lib/containers
          fi
          df -h / /var/lib/containers

      # Pull the pinned bases from Lumen's copies on ghcr.io first, which keep
      # them after quay.io deletes them (base.yml). Podman uses a copy only for a
      # pull by digest, and falls back to quay.io when there is none yet, as for
      # a new pin before its pull request is merged.
      - name: Pull the bases from their copies
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}
        run: |
          sudo mkdir -p /etc/containers/registries.conf.d
          python3 image/bump_bases.py mirrors "$REGISTRY" image/Containerfile tests/lint/Containerfile |
            sudo tee /etc/containers/registries.conf.d/50-lumen-bases.conf
          sudo podman info --format '{{json .Registries}}'

      # The build runs as root: bootc images hold files of many owners, and
      # rootful Podman keeps them exactly.
      - name: Log in to ghcr.io
        if: inputs.publish
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s\n' "$TOKEN" | sudo podman login --username "$GITHUB_ACTOR" --password-stdin ghcr.io

      - name: Work out the build version
        id: version
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          tags=$RUNNER_TEMP/tags.json log=$RUNNER_TEMP/list-tags.log
          printf '{"Tags": []}\n' >"$tags"
          if [[ $PUBLISH == true ]]; then
            # The tags already on ghcr.io, so a second build on the same day
            # gets the next suffix. Until the first push the repository doesn't
            # exist, and the registry says its name is unknown. Root has the
            # login, and the runner writes the files.
            # shellcheck disable=SC2024
            if ! sudo skopeo list-tags "docker://$REGISTRY_IMAGE" >"$tags" 2>"$log"; then
              if grep -qiE 'name unknown|not known to registry' "$log"; then
                printf '%s has no tags yet.\n' "$REGISTRY_IMAGE"
                printf '{"Tags": []}\n' >"$tags"
              else
                cat "$log" >&2
                exit 1
              fi
            fi
            # A commit is published once. Pushing it again would move its
            # sha- tag, which never moves.
            if grep -qF "\"sha-$GITHUB_SHA\"" "$tags"; then
              printf '::error::%s is already published as %s:sha-%s.\n' \
                "$GITHUB_SHA" "$REGISTRY_IMAGE" "$GITHUB_SHA"
              exit 1
            fi
          fi
          version=$(python3 image/build_version.py image/Containerfile "$tags")
          printf 'version=%s\n' "$version" >>"$GITHUB_OUTPUT"
          printf 'Build version: %s\n' "$version"

      # The Containerfile's own checks run in the build: image/check-image.sh
      # and bootc container lint.
      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sudo podman build --file image/Containerfile --target lumen \
            --build-arg LUMEN_BUILD_VERSION="$VERSION" \
            --build-arg LUMEN_COMMIT="$GITHUB_SHA" \
            --tag "$LOCAL_IMAGE" .
          label=$(sudo podman image inspect \
            --format '{{index .Labels "org.opencontainers.image.version"}}' "$LOCAL_IMAGE")
          if [[ $label != "$VERSION" ]]; then
            printf '::error::The image says it is version "%s", not %s.\n' "$label" "$VERSION"
            exit 1
          fi
          sudo podman image ls "$LOCAL_IMAGE"
          df -h /

      # Read the newest build on ghcr.io, as users would, without logging in.
      # Re-chunking keeps its layer plan once it is re-chunked itself, and the
      # next step measures the update from it. Builds of main must be able to
      # read it; other builds go on without it, as a fork's may have to.
      - name: Read the newest build on ghcr.io
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          dir=$RUNNER_TEMP/previous log=$RUNNER_TEMP/previous.log
          mkdir -p "$dir"
          if ! digest=$(skopeo inspect --no-creds --format '{{.Digest}}' "docker://$REGISTRY_IMAGE:dev" 2>"$log"); then
            if grep -qiE 'manifest unknown|name unknown|not known to registry' "$log"; then
              printf '%s:dev does not exist yet.\n' "$REGISTRY_IMAGE"
              exit 0
            fi
            cat "$log" >&2
            if [[ $PUBLISH == true ]]; then
              printf '::error::Cannot read %s:dev without logging in. Make the package public.\n' "$REGISTRY_IMAGE"
              exit 1
            fi
            printf '::warning::Cannot read %s:dev, so this build is not compared with it.\n' "$REGISTRY_IMAGE"
            exit 0
          fi
          skopeo inspect --no-creds --raw "docker://$REGISTRY_IMAGE@$digest" >"$dir/manifest.json"
          skopeo inspect --no-creds --config "docker://$REGISTRY_IMAGE@$digest" >"$dir/config.json"
          # Only a re-chunked build has a layer plan to keep.
          status=0
          python3 image/rechunk.py chunked "$dir/manifest.json" || status=$?
          case $status in
            0) printf 'docker://%s@%s\n' "$REGISTRY_IMAGE" "$digest" >"$dir/plan" ;;
            1) ;;
            *) exit 1 ;;
          esac

      # image/rechunk.sh re-chunks the image with rpm-ostree, from the image
      # itself, into an OCI layout, then checks it: the same labels and
      # settings, image/check-image.sh and bootc container lint.
      - name: Re-chunk
        run: |
          plan=$RUNNER_TEMP/previous/plan previous=()
          [[ ! -f $plan ]] || previous=("$(<"$plan")")
          sudo image/rechunk.sh "$LOCAL_IMAGE" "$RUNNER_TEMP/rechunked" "${previous[@]}"
          sudo du -sh "$RUNNER_TEMP/rechunked"
          df -h /

      # What an update from the newest build on ghcr.io to this one downloads.
      # Over the budget, the build fails, unless the base image changed.
      - name: Measure the download
        run: |
          dir=$RUNNER_TEMP/previous new=$RUNNER_TEMP/new
          mkdir -p "$new"
          # Root wrote the layout, and the runner writes the files.
          # shellcheck disable=SC2024
          sudo skopeo inspect --raw "oci:$RUNNER_TEMP/rechunked:latest" >"$new/manifest.json"
          # shellcheck disable=SC2024
          sudo skopeo inspect --config "oci:$RUNNER_TEMP/rechunked:latest" >"$new/config.json"
          budget=$DOWNLOAD_BUDGET_MIB previous=
          # The previous manifest's bytes give its digest.
          [[ ! -f $dir/manifest.json ]] || previous=sha256:$(sha256sum <"$dir/manifest.json" | cut -d' ' -f1)
          if [[ -n $DOWNLOAD_BUDGET_EXEMPT && $previous == "$DOWNLOAD_BUDGET_EXEMPT" ]]; then
            printf 'The update from %s is not held to the budget (DOWNLOAD_BUDGET_EXEMPT).\n\n' \
              "$DOWNLOAD_BUDGET_EXEMPT" | tee -a "$GITHUB_STEP_SUMMARY"
            budget=1000000
          fi
          args=("$budget" "$new/manifest.json" "$new/config.json")
          [[ ! -f $dir/manifest.json ]] || args+=("$dir/manifest.json" "$dir/config.json")
          python3 image/rechunk.py download "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

      # The SBOM: every package in the image, as SPDX JSON (ADR 0008).
      # image/sbom.sh runs syft on the files of the re-chunked image, which is
      # what gets pushed, reading only its rpm database: scanning everything,
      # syft needed more memory than the runner has. image/sbom.py then checks
      # that the SBOM lists exactly the RPM packages the image has. The sign
      # job attaches it to builds of main; every run keeps it for 30 days.
      - name: Make the SBOM
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The syft the lint container has (tests/lint/Containerfile), whose
          # tests (image/test_sbom.py) run sbom.sh the same way.
          version=$(sed -n 's/^ARG SYFT_VERSION=//p' tests/lint/Containerfile)
          sha256=$(sed -n 's/^ARG SYFT_SHA256=//p' tests/lint/Containerfile)
          archive=$RUNNER_TEMP/syft.tar.gz dir=$RUNNER_TEMP/sbom
          curl --fail --silent --show-error --location --output "$archive" \
            "https://github.com/anchore/syft/releases/download/v$version/syft_${version}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$sha256" "$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/bin" "$dir"
          tar -xzf "$archive" -C "$RUNNER_TEMP/bin" syft
          root=$(sudo podman image mount "$LOCAL_IMAGE-rechunked")
          sudo env PATH="$RUNNER_TEMP/bin:$PATH" \
            image/sbom.sh "$root" "$REGISTRY_IMAGE" "$VERSION" "$dir/lumen.spdx.json"
          sudo podman image unmount "$LOCAL_IMAGE-rechunked"
          # Root runs Podman, and the runner writes the file.
          # shellcheck disable=SC2024
          sudo podman run --rm --pull=never --entrypoint=rpm "$LOCAL_IMAGE-rechunked" \
            --query --all --queryformat '%{NAME} %{EPOCHNUM}:%{VERSION}-%{RELEASE} %{ARCH}\n' >"$dir/packages"
          python3 image/sbom.py check "$dir/lumen.spdx.json" "$dir/packages" | tee -a "$GITHUB_STEP_SUMMARY"
          ls -l "$dir"

      - name: Keep the SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          path: ${{ runner.temp }}/sbom/lumen.spdx.json
          archive: false
          retention-days: 30
          if-no-files-found: error

      # The qcow2 the boot test starts (step 1.9). image-builder installs the
      # re-chunked image on a disk with the image's own bootc, which records
      # the name it is given as the image the system follows, so the image
      # gets the name Lumen systems follow (ADR 0011). image/disk.toml adds
      # the kernel argument that mounts the Btrfs root with compression
      # (ADR 0016).
      - name: Make the qcow2
        run: |
          dir=$RUNNER_TEMP/disk
          mkdir -p "$dir"
          # osbuild mounts the new Btrfs root, which needs the host's module.
          sudo modprobe btrfs
          sudo podman tag "$LOCAL_IMAGE-rechunked" "$REGISTRY_IMAGE:dev"
          sudo podman run --rm --privileged --security-opt label=type:unconfined_t \
            --volume /var/lib/containers/storage:/var/lib/containers/storage \
            --volume "$dir:/output" --volume "$PWD/image/disk.toml:/disk.toml:ro" \
            "$IMAGE_BUILDER" build --output-dir /output --progress verbose \
            --blueprint /disk.toml --bootc-ref "$REGISTRY_IMAGE:dev" qcow2
          sudo podman untag "$LOCAL_IMAGE-rechunked" "$REGISTRY_IMAGE:dev"
          sudo find "$dir" -type f -exec ls -ls {} +
          df -h /

      # image-builder runs bootc and bootupd where SELinux is off, so two
      # files they write get no label; image/label-disk.sh gives them the ones
      # an install from the ISO has (ADR 0018). Then image/check-disk.sh reads
      # the disk read-only: the partitions, the boot files and those labels,
      # and what the deployment follows. The boot test starts the qcow2 made
      # again from the labeled disk.
      - name: Label and check the qcow2
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dir=$RUNNER_TEMP/disk
          qcow2=$(sudo find "$dir" -name '*.qcow2' -printf '%P\n')
          qemu_img() { sudo podman run --rm --volume "$dir:/output" --entrypoint qemu-img "$IMAGE_BUILDER" "$@"; }
          qemu_img convert -O raw "/output/$qcow2" /output/check.raw
          report=$RUNNER_TEMP/disk-report status=0
          # shellcheck disable=SC2024
          sudo image/label-disk.sh "$dir/check.raw" >"$report" 2>&1 || status=$?
          # shellcheck disable=SC2024
          sudo image/check-disk.sh "$dir/check.raw" "$REGISTRY_IMAGE:dev" "$VERSION" >>"$report" 2>&1 || status=$?
          if ((status == 0)); then
            qemu_img convert -O qcow2 /output/check.raw /output/labeled.qcow2
            sudo mv "$dir/labeled.qcow2" "$dir/$qcow2"
          fi
          sudo rm "$dir/check.raw"
          cat "$report"
          # The backticks are Markdown, for the run's summary page.
          # shellcheck disable=SC2016
          {
            printf '### The qcow2\n\n```text\n'
            cat "$report"
            printf '```\n'
          } >>"$GITHUB_STEP_SUMMARY"
          exit "$status"

      # The boot test (step 1.9; spec, "Boot test"): start the qcow2 in a VM
      # with Secure Boot and check, from inside, the login screen within 60 s
      # and no failed units (tests/boot/boot_disk.py, ADR 0017). The VM needs
      # KVM, which the runners have (step 1.8b-3); its writes go to a
      # snapshot, so the disk stays as image-builder made it.
      - name: Boot the qcow2
        run: |
          if [[ ! -c /dev/kvm ]]; then
            echo "::error::This runner has no /dev/kvm, so it can't run the boot test's VM at a usable speed."
            exit 1
          fi
          fedora=$(sed -n 's/^FROM //p' tests/lint/Containerfile)
          sudo podman build --quiet --build-arg "FEDORA=$fedora" --tag localhost/lumen-boot tests/boot
          dir=$RUNNER_TEMP/disk out=$RUNNER_TEMP/boot report=$RUNNER_TEMP/boot-report status=0
          qcow2=$(sudo find "$dir" -name '*.qcow2' -printf '%P\n')
          mkdir -p "$out"
          # The runner writes the report.
          # shellcheck disable=SC2024
          sudo podman run --rm --network=none --device /dev/kvm \
            --volume "$dir:/disk:ro" --volume "$PWD:/src:ro" --volume "$out:/out" \
            localhost/lumen-boot python3 /src/tests/boot/boot_disk.py --require-kvm "/disk/$qcow2" /out \
            >"$report" 2>&1 || status=$?
          cat "$report"
          {
            printf '### The boot test\n\n```text\n'
            cat "$report"
            printf '```\n'
          } >>"$GITHUB_STEP_SUMMARY"
          exit "$status"

      # The serial ports' and QEMU's logs and the screenshot of the boot test.
      - name: Keep the boot test's logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: boot-qcow2
          path: ${{ runner.temp }}/boot
          retention-days: 7
          if-no-files-found: ignore

      # The tags that never move. dev moves in the sign job, once the image is
      # signed. skopeo pushes the layout as it is, so the digest is the one
      # measured above, and the one the sign job signs.
      - name: Push to ghcr.io
        id: push
        if: inputs.publish
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          digestfile=$RUNNER_TEMP/digest
          sudo skopeo copy --preserve-digests --retry-times 3 --digestfile "$digestfile" \
            "oci:$RUNNER_TEMP/rechunked:latest" "docker://$REGISTRY_IMAGE:dev-$VERSION"
          digest=$(<"$digestfile")
          sudo skopeo copy --preserve-digests \
            "docker://$REGISTRY_IMAGE@$digest" "docker://$REGISTRY_IMAGE:sha-$GITHUB_SHA"
          printf 'digest=%s\n' "$digest" >>"$GITHUB_OUTPUT"
          # The backticks are Markdown, for the run's summary page.
          # shellcheck disable=SC2016
          {
            printf '### Pushed %s\n\n' "$REGISTRY_IMAGE"
            printf -- '- Digest: `%s`\n' "$digest"
            printf -- '- Tags: `dev-%s`, `sha-%s`. `dev` moves once the image is signed.\n' "$VERSION" "$GITHUB_SHA"
          } >>"$GITHUB_STEP_SUMMARY"

  # Sign the pushed image and attach its SBOM, check both with the key and the
  # trust policy that ship in the image, then move dev to it (ADR 0008).
  # If this job fails, the dated and sha- tags stay unsigned and dev stays
  # where it was; once the cause is fixed, re-run this job alone ("Re-run
  # failed jobs"), because a new run would find the commit already pushed.
  sign:
    name: Sign the image
    needs: build
    if: inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Its secrets are the signing key. A deployment record for every build
    # would only clutter the repository page.
    environment:
      name: image-signing
      deployment: false
    env:
      REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/lumen
      DIGEST: ${{ needs.build.outputs.digest }}
      PUBLIC_KEY: image/overlay/usr/share/pki/containers/lumen.pub
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: lumen.spdx.json
          path: ${{ runner.temp }}/sbom

      # The version and checksum the lint container has (tests/lint/Containerfile),
      # so CI signs the way image/test_signatures.py checks.
      - name: Install cosign
        run: |
          version=$(sed -n 's/^ARG COSIGN_VERSION=//p' tests/lint/Containerfile)
          sha256=$(sed -n 's/^ARG COSIGN_SHA256=//p' tests/lint/Containerfile)
          mkdir -p "$RUNNER_TEMP/bin"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/bin/cosign" \
            "https://github.com/sigstore/cosign/releases/download/v$version/cosign-linux-amd64"
          printf '%s  %s\n' "$sha256" "$RUNNER_TEMP/bin/cosign" | sha256sum --check --strict
          chmod 0755 "$RUNNER_TEMP/bin/cosign"
          printf '%s\n' "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"

      # cosign writes the login to ~/.docker/config.json, where skopeo finds
      # it too.
      - name: Log in to ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s\n' "$TOKEN" | cosign login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      # The trust policy from image/overlay, with its key path pointing to the
      # key in the checkout, and the overlay's registries.d. skopeo checks an
      # image against the policy before it copies anything, and must refuse
      # this one while it is unsigned.
      - name: Check that the trust policy refuses the image unsigned
        run: |
          sed "s#/usr/share/pki/containers/lumen.pub#$PWD/$PUBLIC_KEY#" image/overlay/etc/containers/policy.json \
            >"$RUNNER_TEMP/policy.json"
          if out=$(skopeo --policy "$RUNNER_TEMP/policy.json" --registries.d image/overlay/etc/containers/registries.d \
            copy --remove-signatures "docker://$REGISTRY_IMAGE@$DIGEST" "oci:$RUNNER_TEMP/check:unsigned" 2>&1); then
            printf '::error::The trust policy accepted %s@%s before it was signed.\n' "$REGISTRY_IMAGE" "$DIGEST"
            exit 1
          fi
          if ! grep -qF 'A signature was required, but no signature exists' <<<"$out"; then
            printf '%s\n' "$out" >&2
            exit 1
          fi
          printf 'Refused, as it should be: %s\n' "$out"
          rm -rf "$RUNNER_TEMP/check"

      - name: Sign
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          if [[ -z $COSIGN_PRIVATE_KEY ]]; then
            printf '::error::%s %s\n' "The image-signing environment has no COSIGN_PRIVATE_KEY secret, or image.yml" \
              "doesn't pass it. docs/decisions/0008-image-signing.md says how the key is made and stored."
            exit 1
          fi
          image/sign.sh sign "$REGISTRY_IMAGE@$DIGEST" env://COSIGN_PRIVATE_KEY "$RUNNER_TEMP/sbom/lumen.spdx.json"

      # With the public key in the image: cosign checks the signature and the
      # attestation, and skopeo, which reads signatures as bootc does, must
      # now accept the image. This download is the whole image, about 3 GiB.
      - name: Check the signature and the SBOM
        run: |
          image/sign.sh verify "$REGISTRY_IMAGE@$DIGEST" "$PUBLIC_KEY" --sbom
          skopeo --policy "$RUNNER_TEMP/policy.json" --registries.d image/overlay/etc/containers/registries.d \
            copy --quiet --remove-signatures "docker://$REGISTRY_IMAGE@$DIGEST" "oci:$RUNNER_TEMP/check:signed"
          rm -rf "$RUNNER_TEMP/check"
          printf 'The trust policy accepts %s@%s.\n' "$REGISTRY_IMAGE" "$DIGEST"

      # skopeo copies only the manifest: the layers and the signature, which
      # is stored by digest, are already there.
      - name: Move dev to the signed image
        run: |
          skopeo copy --preserve-digests "docker://$REGISTRY_IMAGE@$DIGEST" "docker://$REGISTRY_IMAGE:dev"
          # The backticks are Markdown, for the run's summary page.
          # shellcheck disable=SC2016
          {
            printf '### Signed %s\n\n' "$REGISTRY_IMAGE"
            printf -- '- Digest: `%s`, signed with the key in `%s`\n' "$DIGEST" "$PUBLIC_KEY"
            printf -- '- Signature: tag `sha256-%s.sig`; SBOM attestation: tag `sha256-%s.att`\n' "${DIGEST#sha256:}" \
              "${DIGEST#sha256:}"
            printf -- '- `dev` now points to it\n'
          } >>"$GITHUB_STEP_SUMMARY"
