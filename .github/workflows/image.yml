#
# The image workflow: build image/Containerfile and check it on every push and
# pull request. Builds of main also push the image to ghcr.io as `dev`.
# docs/architecture.md, section 9.8.
#
# The build itself is in build-image.yml. It is called from two jobs so that
# only builds of main get a token that can write to ghcr.io.

name: image

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A new push cancels the older run of a branch or pull request. A run on main
  # is never cancelled once it has started, so a push to ghcr.io is never cut
  # off; GitHub still lets a newer push replace one that is waiting to start.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Check
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    permissions:
      contents: read
    uses: ./.github/workflows/build-image.yml
    with:
      publish: false

  publish:
    name: Publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      publish: true
