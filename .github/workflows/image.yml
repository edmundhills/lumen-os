#
# The image workflow: build each edition of image/Containerfile and check it,
# for every push to a branch other than main and every pull request. Builds of
# main are the publish workflow's (publish.yml), which also pushes each edition
# to ghcr.io and signs it. docs/architecture.md, section 9.8.
#
# The build itself is in build-image.yml, which builds one edition. This
# workflow runs it once per edition, on a runner each, and an edition that
# fails holds back only itself (ADR 0023). Its token can only read.
#
# A change to documents alone starts no run: the lint workflow checks those,
# and they can't change an image. It also leaves alone the run of the push
# before it, which a new run would cancel: a note pushed after a change no
# longer restarts the two hours of builds that test the change. To build
# anyway, run the workflow by hand: Actions > image > Run workflow.

name: image

on:
  push:
    branches-ignore: [main]
    paths-ignore:
      - "**.md"
      - docs/**
      - LICENSE
      - LICENSES/**
  pull_request:
    paths-ignore:
      - "**.md"
      - docs/**
      - LICENSE
      - LICENSES/**
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A new push cancels the older run of a branch or pull request. A run
  # started by hand on main is left to finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Check ${{ matrix.edition }}
    strategy:
      fail-fast: false
      matrix:
        edition: [lumen, gaming, nvidia, gaming-nvidia]
    permissions:
      contents: read
    uses: ./.github/workflows/build-image.yml
    with:
      edition: ${{ matrix.edition }}
      publish: false
