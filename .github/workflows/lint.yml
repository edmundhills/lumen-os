#
# The lint workflow: `just lint` and `just test` on every push and pull request.
# They run in the same container as on a developer's PC (tests/lint/), so CI
# and WSL can't disagree. docs/architecture.md, section 9.8.

name: lint

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A new push cancels the older run of a branch or pull request. A run on main
  # is never cancelled once it has started; GitHub still lets a newer push
  # replace one that is waiting to start.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Lint and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # The runner has Podman but not just. This is the version the lint
      # container has, from just's release page, checked against its checksum.
      - name: Install just
        env:
          JUST_VERSION: 1.59.0
          JUST_SHA256: 409044617b6f06517c1035e55ca38c8c856ff8b650e41bc2aa1ef82d5903a23e
        run: |
          archive=$RUNNER_TEMP/just.tar.gz
          curl --fail --silent --show-error --location --output "$archive" \
            "https://github.com/casey/just/releases/download/$JUST_VERSION/just-$JUST_VERSION-x86_64-unknown-linux-musl.tar.gz"
          printf '%s  %s\n' "$JUST_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/bin" just
          printf '%s\n' "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"

      # The lint container's base, like the image's, is pulled from its copy on
      # ghcr.io first, and from Fedora's registry when there is none
      # (base.yml, build-image.yml).
      - name: Pull the bases from their copies
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}
        run: |
          sudo mkdir -p /etc/containers/registries.conf.d
          python3 image/bump_bases.py mirrors "$REGISTRY" image/Containerfile tests/lint/Containerfile |
            sudo tee /etc/containers/registries.conf.d/50-lumen-bases.conf
          podman info --format '{{json .Registries}}'

      - name: just lint
        run: just lint

      - name: just test
        run: just test
