#
# The thumbnails workflow: Lumen's video thumbnailer makes H.264 and HEVC
# thumbnails with Flathub's real runtime (step 1.14b,
# docs/decisions/0025-codecs.md; tests/thumbnails/test-thumbnailer.sh). It runs
# when the thumbnailer, Lumen's Flatpak settings or the test change, and every
# week, because Flathub updates the runtime the thumbnailer uses.

name: thumbnails

on:
  push:
    paths:
      - image/overlay/usr/libexec/lumen-video-thumbnailer
      - image/overlay/usr/share/thumbnailers/**
      - image/overlay/usr/share/flatpak/**
      - tests/thumbnails/**
      - .github/workflows/thumbnails.yml
  pull_request:
    paths:
      - image/overlay/usr/libexec/lumen-video-thumbnailer
      - image/overlay/usr/share/thumbnailers/**
      - image/overlay/usr/share/flatpak/**
      - tests/thumbnails/**
      - .github/workflows/thumbnails.yml
  schedule:
    - cron: "41 4 * * 2"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# `bash -eo pipefail` for every step (build-image.yml).
defaults:
  run:
    shell: bash

jobs:
  thumbnails:
    name: Video thumbnails from Flathub's codecs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Flatpak
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq flatpak
          flatpak --version

      - name: Test the thumbnailer
        run: bash tests/thumbnails/test-thumbnailer.sh
